name: macOS build

# Run it from the Actions tab ("Run workflow"); a tag like v0.9.0 runs it through release.yml.
# The disk image is uploaded as the "me-voice-macos" artifact (installer/output/me-voice-<version>.dmg).
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake llvm librsvg
      - name: Run tests
        run: bash scripts/build-macos.sh --test
      - name: Build app and disk image (Apple silicon)
        run: bash scripts/build-macos.sh --dmg
      - name: Smoke test packaged app startup and restart
        run: bash scripts/smoke-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: me-voice-macos
          path: installer/output/*.dmg

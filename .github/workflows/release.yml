name: Release

# Push a tag like v0.9.0 (after .\scripts\release.ps1 -Bump ...). This builds Windows and macOS,
# then publishes a GitHub release for the tag with both installers and the CHANGELOG.md notes.
on:
  push:
    tags: ['v*']

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    uses: ./.github/workflows/macos.yml

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The notes are the CHANGELOG.md section for this version (tag without the "v").
          awk -v v="${TAG#v}" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "me-voice ${TAG#v}" --notes-file notes.md

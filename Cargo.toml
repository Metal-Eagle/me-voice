[package]
name = "me-voice"
version = "1.5.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit", "x11", "wayland"] }
enigo = "0.6.1"
epaint_default_fonts = "0.37.0"
global-hotkey = "0.9.0"
hound = "3.5.1"
interprocess = "2.4.6"
notify-rust = "4.11.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
softbuffer = "0.4.8"
tao = "0.37.1"
transcribe-rs = { version = "0.3.12", default-features = false, features = ["onnx"] }
raw-window-handle = "0.6.2"
tray-icon = "0.26.1"
ureq = "3.4.2"
whisper-rs = "0.16.0"

# Small, fast release binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
